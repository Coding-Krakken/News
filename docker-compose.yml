version: '3.8'

services:
  # Postgres services for the Node.js backend (auth, bookmarks, filters)
  postgres:
    image: postgres:15-alpine
    container_name: news_db
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:15-alpine
    container_name: news_test_db
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_test_db
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB and analytics backend (optional) for the analytics components
  mongodb:
    image: mongo:7
    container_name: news_analytics_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=news_analytics
    networks:
      - news_network

  analytics_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news_analytics_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=news_analytics
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_BASE_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SECRET_KEY=dev-secret-key-change-in-production
      - LOG_LEVEL=INFO
    depends_on:
      - mongodb
    networks:
      - news_network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  analytics_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news_analytics_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_ENVIRONMENT=local
    depends_on:
      - analytics_backend
    networks:
      - news_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

networks:
  news_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:

