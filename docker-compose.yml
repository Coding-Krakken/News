version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: news_analytics_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=news_analytics
    networks:
      - news_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news_analytics_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=news_analytics
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_BASE_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SECRET_KEY=dev-secret-key-change-in-production
      - LOG_LEVEL=INFO
    depends_on:
      - mongodb
    networks:
      - news_network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news_analytics_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_ENVIRONMENT=local
    depends_on:
      - backend
    networks:
      - news_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

networks:
  news_network:
    driver: bridge

volumes:
  mongodb_data:
