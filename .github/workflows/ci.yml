name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: news_user
          POSTGRES_PASSWORD: news_password
          POSTGRES_DB: news_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql client and create compatibility DB role
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          # Create a compatible `root` role if any job or script expects it.
          PGPASSWORD=news_password psql -h localhost -p 5433 -U news_user -c "CREATE ROLE root WITH LOGIN PASSWORD 'news_password';" || true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run database migrations
        working-directory: ./backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_NAME: news_test_db
          TEST_DB_USER: news_user
          TEST_DB_PASSWORD: news_password
        run: |
          for file in migrations/*.sql; do
            PGPASSWORD=news_password psql -h localhost -p 5433 -U news_user -d news_test_db < "$file"
          done
      
      - name: Run linter
        working-directory: ./backend
        run: npm run lint
      
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          NODE_ENV: test
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_NAME: news_test_db
          TEST_DB_USER: news_user
          TEST_DB_PASSWORD: news_password
        run: npm test
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run linter
        working-directory: ./frontend
        run: npm run lint
      
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./frontend/coverage
          flags: frontend

  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: news_user
          POSTGRES_PASSWORD: news_password
          POSTGRES_DB: news_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Ensure psql client and create compatibility DB role
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          # Create a compatible `root` role if any job or script expects it.
          PGPASSWORD=news_password psql -h localhost -p 5432 -U news_user -c "CREATE ROLE root WITH LOGIN PASSWORD 'news_password';" || true
      
      - name: Run database migrations
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: news_db
          DB_USER: news_user
          DB_PASSWORD: news_password
        run: |
          for file in migrations/*.sql; do
            PGPASSWORD=news_password psql -h localhost -p 5432 -U news_user -d news_db < "$file"
          done
      
      - name: Run E2E tests
        working-directory: ./frontend
        env:
          CI: true
        run: npm run test:e2e
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Build backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build
      
      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
